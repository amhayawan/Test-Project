name: Build Windows app

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build HAZ-CRM.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HAZ-CRM
          --add-data "crm/templates;crm/templates" --add-data "crm/static;crm/static"
          haz_crm.py
      - name: Smoke test (server mode starts and serves the setup page)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\HAZ-CRM.exe -ArgumentList "--server","--port","8099","--data","$env:RUNNER_TEMP\crmdata" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:8099/setup -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe did not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: HAZ-CRM-windows
          path: dist/HAZ-CRM.exe
