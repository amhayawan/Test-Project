{% extends "base.html" %}
{% block content %}
<h1>تغيير كلمة المرور</h1>
<form method="post" class="card form">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  {% if error %}<div class="flash error wide">{{ error }}</div>{% endif %}
  <label>كلمة المرور الحالية<input name="current" type="password" required></label>
  <label>كلمة المرور الجديدة<input name="new" type="password" required minlength="6"></label>
  <label>تأكيد كلمة المرور الجديدة<input name="new2" type="password" required minlength="6"></label>
  <div class="wide actions"><button class="btn primary">حفظ</button></div>
</form>
{% endblock %}
