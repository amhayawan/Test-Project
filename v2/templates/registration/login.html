{% extends "base.html" %}{% load i18n %}
{% block auth %}
<form method="post" class="card auth-card">{% csrf_token %}
  <h1>{% translate "Dr. Hassan Abbas Zaki Association" %}</h1>
  <p class="muted">{% translate "Sign in" %}</p>
  {% if form.non_field_errors %}<div class="flash error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <label>{% translate "Username" %}<input name="username" required autofocus dir="ltr" value="{{ form.username.value|default:'' }}"></label>
  <label>{% translate "Password" %}<input name="password" type="password" required></label>
  <button class="btn primary">{% translate "Sign in" %}</button>
</form>
<form method="post" action="{% url 'set_language' %}" class="auth-lang">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button name="language" value="ar" class="link">العربية</button> · <button name="language" value="en" class="link">English</button>
</form>
{% endblock %}
